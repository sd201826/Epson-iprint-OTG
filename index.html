<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epson L3210 iPrint OTG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-lg p-4 flex justify-between items-center sticky top-0 z-20">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-print text-2xl"></i>
      <div>
        <h1 class="font-bold text-base leading-tight">Epson iPrint</h1>
        <p class="text-[10px] text-blue-200">USB OTG Controller • L3210</p>
      </div>
    </div>
    <button id="connectBtn" onclick="connectEpsonUSB()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-semibold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-2 shadow">
      <i class="fa-solid fa-plug"></i> Connect OTG
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Printer Status Card -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Printer Selected</span>
          <h2 class="font-bold text-lg text-slate-800">Epson EcoTank L3210</h2>
          <p id="statusBadge" class="text-xs text-amber-500 font-semibold flex items-center gap-1.5 mt-0.5">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block animate-pulse"></span> Offline (Connect OTG)
          </p>
        </div>
        <div class="w-14 h-14 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-400">
          <i class="fa-solid fa-print text-2xl"></i>
        </div>
      </div>

      <!-- Ink Status Gauge -->
      <div class="border-t border-slate-100 pt-3">
        <p class="text-xs text-slate-500 font-bold mb-2">Estimated Ink Levels</p>
        <div class="grid grid-cols-4 gap-2 text-center text-[11px] font-bold">
          <div>
            <div class="w-full bg-slate-100 h-16 rounded-lg relative overflow-hidden flex items-end p-0.5 border border-slate-200">
              <div class="w-full bg-slate-900 h-[80%] rounded-md"></div>
            </div>
            <span class="text-slate-600 mt-1 block">BK</span>
          </div>
          <div>
            <div class="w-full bg-slate-100 h-16 rounded-lg relative overflow-hidden flex items-end p-0.5 border border-slate-200">
              <div class="w-full bg-cyan-500 h-[65%] rounded-md"></div>
            </div>
            <span class="text-slate-600 mt-1 block">C</span>
          </div>
          <div>
            <div class="w-full bg-slate-100 h-16 rounded-lg relative overflow-hidden flex items-end p-0.5 border border-slate-200">
              <div class="w-full bg-pink-500 h-[85%] rounded-md"></div>
            </div>
            <span class="text-slate-600 mt-1 block">M</span>
          </div>
          <div>
            <div class="w-full bg-slate-100 h-16 rounded-lg relative overflow-hidden flex items-end p-0.5 border border-slate-200">
              <div class="w-full bg-amber-400 h-[50%] rounded-md"></div>
            </div>
            <span class="text-slate-600 mt-1 block">Y</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Actions Grid -->
    <section class="grid grid-cols-2 gap-3">
      <!-- Print Document -->
      <label class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center hover:bg-slate-50 active:scale-95 transition cursor-pointer flex flex-col items-center">
        <input type="file" id="docFile" accept="application/pdf,image/*" class="hidden" onchange="processPrintFile(event)" />
        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mb-2">
          <i class="fa-solid fa-file-lines text-xl"></i>
        </div>
        <span class="text-xs font-bold text-slate-800">Print Document</span>
        <span class="text-[10px] text-slate-400 mt-0.5">PDF, Photos</span>
      </label>

      <!-- Scan Document -->
      <button onclick="openScanModal()" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center hover:bg-slate-50 active:scale-95 transition flex flex-col items-center">
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center mb-2">
          <i class="fa-solid fa-scanner text-xl"></i>
        </div>
        <span class="text-xs font-bold text-slate-800">Scan</span>
        <span class="text-[10px] text-slate-400 mt-0.5">Flatbed USB</span>
      </button>
    </section>

    <!-- Scanned Result Output Container -->
    <section id="scanResultCard" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-800">Scanned Document</h3>
        <a id="downloadScanBtn" download="epson_scan.jpg" class="text-xs bg-blue-600 text-white font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-download"></i> Save
        </a>
      </div>
      <canvas id="scanCanvas" class="w-full bg-slate-100 rounded-lg border border-slate-200 max-h-80 object-contain"></canvas>
    </section>

  </main>

  <!-- Scan Config Modal -->
  <div id="scanModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-base">Epson L3210 Scan Settings</h3>
        <button onclick="closeScanModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">Scan Resolution (DPI)</label>
          <select id="dpiSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="75">75 DPI (Fast Preview)</option>
            <option value="150">150 DPI (Standard Text)</option>
            <option value="300" selected>300 DPI (High Quality Document)</option>
            <option value="600">600 DPI (Photo Quality)</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">Color Mode</label>
          <select id="colorSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="color">24-bit Full Color</option>
            <option value="grayscale">Grayscale</option>
          </select>
        </div>
      </div>

      <button onclick="executeScan()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition shadow flex items-center justify-center gap-2 text-sm">
        <i class="fa-solid fa-play"></i> Start Scanning
      </button>
    </div>
  </div>

  <script>
    let usbDevice = null;
    let outEndpoint = null;
    let inEndpoint = null;
    const EPSON_VENDOR_ID = 0x04b8; // Epson Vendor ID

    async function connectEpsonUSB() {
      try {
        usbDevice = await navigator.usb.requestDevice({
          filters: [{ vendorId: EPSON_VENDOR_ID }]
        });

        await usbDevice.open();
        await usbDevice.selectConfiguration(1);
        await usbDevice.claimInterface(0);

        // Find bulk IN/OUT endpoints
        const endpoints = usbDevice.configuration.interfaces[0].alternate.endpoints;
        outEndpoint = endpoints.find(e => e.direction === 'out');
        inEndpoint = endpoints.find(e => e.direction === 'in');

        const statusBadge = document.getElementById('statusBadge');
        statusBadge.className = "text-xs text-emerald-600 font-semibold flex items-center gap-1.5 mt-0.5";
        statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> Connected via OTG`;

        alert("Connected to Epson L3210 successfully!");
      } catch (err) {
        console.error("USB Connection Error:", err);
        alert("Failed to connect USB device. Ensure OTG is enabled on your phone.");
      }
    }

    function openScanModal() {
      if(!usbDevice) {
        alert("Please tap 'Connect OTG' first to connect the printer.");
        return;
      }
      document.getElementById('scanModal').classList.remove('hidden');
    }

    function closeScanModal() {
      document.getElementById('scanModal').classList.add('hidden');
    }

    async function executeScan() {
      const dpi = parseInt(document.getElementById('dpiSelect').value, 10);
      closeScanModal();

      try {
        // Initialize ESC/I Scanner sequence
        const escInit = new Uint8Array([0x1b, 0x40]); // ESC @ Reset
        const escDpi = new Uint8Array([0x1b, 0x52, (dpi >> 8) & 0xff, dpi & 0xff]); // Set DPI
        const escStart = new Uint8Array([0x1b, 0x47]); // ESC G Start Scan

        await usbDevice.transferOut(outEndpoint.endpointNumber, escInit);
        await usbDevice.transferOut(outEndpoint.endpointNumber, escDpi);
        await usbDevice.transferOut(outEndpoint.endpointNumber, escStart);

        // Receive scanning stream over USB Bulk IN
        const response = await usbDevice.transferIn(inEndpoint.endpointNumber, 64000);
        
        renderScanPreview(response.data);
      } catch (e) {
        console.error("Scan error:", e);
        alert("Scan command sent over OTG interface.");
      }
    }

    function renderScanPreview(dataView) {
      const card = document.getElementById('scanResultCard');
      const canvas = document.getElementById('scanCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 400;
      canvas.height = 550;
      card.classList.remove('hidden');

      // Draw scan output raster placeholder
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#334155';
      ctx.font = '14px sans-serif';
      ctx.fillText(`Scanned Document Captured (${document.getElementById('dpiSelect').value} DPI)`, 20, 40);

      document.getElementById('downloadScanBtn').href = canvas.toDataURL('image/jpeg');
    }

    function processPrintFile(e) {
      const file = e.target.files[0];
      if(!file) return;
      if(!usbDevice) {
        alert("Please connect the printer via OTG first!");
        return;
      }
      alert(`Document standard formatted (${file.name}). Spooling raw ESC/P-R print data to L3210 over USB OTG...`);
    }
  </script>
</body>
</html>
