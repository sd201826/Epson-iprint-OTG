name: Build Windows app
on:
  push:
    branches: [windows-ink-monitor]
    paths:
      - 'Windows-Ink-Monitor/**'
      - '.github/workflows/build-windows-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows x64 app
        run: dotnet publish Windows-Ink-Monitor/EpsonL3210Monitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Epson-L3210-Monitor-Windows-x64
          path: publish/**
          if-no-files-found: error
